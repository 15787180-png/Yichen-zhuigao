  <path d="M50 44 Q52 30 64 30 Q76 30 78 44 Q72 38 64 38 Q56 38 50 44Z" fill="#3E2F28"/>
  <circle cx="59" cy="47" r="1.8" fill="#42526B"/>
  <circle cx="69" cy="47" r="1.8" fill="#42526B"/>
